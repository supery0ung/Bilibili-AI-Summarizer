# 视频过滤规则

version: 1

# 最小视频时长 (秒), >= 1 分钟
min_seconds: 60

# UP主黑名单 (大小写不敏感的子串匹配)
up_deny_contains:
  - "影视飓风"
  - "星球研究所"
  - "李伯清"
  - "亿点点不一样"
  - "观鱼闲谈"

# 标题正则黑名单 (大小写不敏感)
# 示例:
# - '(电影|电视剧|综艺|游戏剧情|通关|速通)'
# - '(PV|预告|trailer|op\b|ed\b)'
# - '(MV|纯音乐|翻唱|舞蹈|asmr)'
title_deny_regex: []

# 当无法确定时是否保留 (true = 更多视频, false = 更保守)
keep_when_uncertain: true
